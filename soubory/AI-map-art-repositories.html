<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nacistické depozitáře umění — Evropa 1939–1945</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0f0e0c;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 3rem;
  font-family: 'Courier Prime', monospace;
  min-height: 100vh;
}

h1 {
  font-family: 'Special Elite', serif;
  color: #9a7c2a;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 0.3rem;
}
.subtitle {
  color: #5a4a2a;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 1.5rem;
  text-align: center;
}

.map-outer {
  width: 100%;
  max-width: 1100px;
  border-top: 5px solid #8c1a00;
  border: 1px solid rgba(154,124,42,0.35);
  border-top-width: 5px;
  box-shadow: 0 0 0 4px #0f0e0c, 0 8px 60px rgba(0,0,0,0.85);
  position: relative;
}

/* The real map sits as a background */
.map-container {
  position: relative;
  width: 100%;
  /* 
    We use OpenStreetMap tiles via a lightweight Leaflet map.
    The dots are placed via Leaflet markers so they sit
    precisely on real geography.
  */
  height: clamp(300px, 60vh, 680px);
  background: #8fa8b8;
}

#leaflet-map {
  width: 100%;
  height: 100%;
}

/* Sepia / aged paper overlay on the map */
#leaflet-map::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(180,140,60,0.18);
  mix-blend-mode: multiply;
  pointer-events: none;
  z-index: 500;
}

/* Custom marker styles */
.marker-ingame {
  background: none;
  border: none;
}
.marker-other {
  background: none;
  border: none;
}

/* Tooltip */
.tt {
  position: absolute;
  background: #120d06;
  border: 1px solid #6a5218;
  border-left: 3px solid #8c1a00;
  color: #e8dfc8;
  font-family: 'Courier Prime', monospace;
  font-size: 0.78rem;
  padding: 0.6rem 0.9rem;
  max-width: 260px;
  line-height: 1.55;
  z-index: 1200;
  pointer-events: none;
  border-radius: 1px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.tt-name { color: #e8c840; font-weight: 700; display: block; margin-bottom: 0.15rem; font-size: 0.85rem; }
.tt-ctry { color: #9a7c2a; font-size: 0.68rem; display: block; margin-bottom: 0.3rem; letter-spacing: 0.08em; text-transform: uppercase; }
.tt-info { color: #c8b890; }

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.7rem 2.5rem;
  margin-top: 1.2rem;
  padding: 0.75rem 1.4rem;
  border: 1px solid rgba(154,124,42,0.18);
  max-width: 1100px;
  width: 100%;
}
.li { display: flex; align-items: center; gap: 0.6rem; font-size: 0.72rem; color: #8a7040; letter-spacing: 0.04em; }

.map-note {
  margin-top: 0.8rem;
  font-size: 0.65rem;
  color: #3a2e18;
  letter-spacing: 0.08em;
  text-align: center;
  max-width: 1100px;
}
</style>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
</head>
<body>

<h1>Nacistické depozitáře umění — Evropa 1939–1945</h1>
<p class="subtitle">20 významných lokací · Pro detaily přejeď myší nad lokací</p>

<div class="map-outer">
  <div class="map-container">
    <div id="leaflet-map"></div>
  </div>
</div>

<div class="legend">
  <div class="li">
    <svg width="16" height="16" viewBox="0 0 16 16">
      <polygon points="8,1 9.5,5.5 14.5,5.5 10.5,8.5 12,13 8,10 4,13 5.5,8.5 1.5,5.5 6.5,5.5" fill="#e8c840" stroke="#9a7020" stroke-width="1"/>
    </svg>
    Depozitáře umění navštívené ve hře
  </div>
  <div class="li">
    <svg width="14" height="14" viewBox="0 0 14 14">
      <circle cx="7" cy="7" r="5.5" fill="#8c1a00" stroke="#e04020" stroke-width="1.2"/>
      <circle cx="7" cy="7" r="2.2" fill="#f06040"/>
    </svg>
    Další významné depozitáře
  </div>
</div>

<p class="map-note">Přejeď myší nad vybranou lokací pro více informací. · Map data © OpenStreetMap contributors</p>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── Init map centred on central Europe ──
const map = L.map('leaflet-map', {
  center: [50.5, 12],
  zoom: 5,
  minZoom: 4,
  maxZoom: 7,
  zoomControl: true,
  scrollWheelZoom: true
});

// Stamen Toner-Lite gives a clean black-and-white base that we tint sepia
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  className: 'map-tiles'
}).addTo(map);

// ── SVG marker helpers ──
function starIcon(size) {
  size = size || 22;
  const s = size, h = s/2;
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? h * 0.95 : h * 0.42;
    const a = (i * 36 - 90) * Math.PI / 180;
    pts.push((h + r * Math.cos(a)).toFixed(2) + ',' + (h + r * Math.sin(a)).toFixed(2));
  }
  const svg = `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${h}" cy="${h}" r="${h-1}" fill="rgba(232,200,80,0.25)"/>
    <polygon points="${pts.join(' ')}" fill="#e8c840" stroke="#9a6a10" stroke-width="1.2"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: 'marker-ingame',
    iconSize: [s, s],
    iconAnchor: [h, h],
    popupAnchor: [0, -h]
  });
}

function dotIcon(size) {
  size = size || 14;
  const s = size, h = s/2;
  const svg = `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${h}" cy="${h}" r="${h-0.5}" fill="#8c1a00" stroke="#e04020" stroke-width="1.4"/>
    <circle cx="${h}" cy="${h}" r="${h*0.38}" fill="#f06040" opacity="0.9"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: 'marker-other',
    iconSize: [s, s],
    iconAnchor: [h, h],
    popupAnchor: [0, -h]
  });
}

// ── Tooltip element ──
const tt = document.createElement('div');
tt.className = 'tt';
tt.style.display = 'none';
document.body.appendChild(tt);

function showTip(e, name, country, info) {
  tt.innerHTML = `<span class="tt-name">${name}</span><span class="tt-ctry">${country}</span><span class="tt-info">${info}</span>`;
  tt.style.display = 'block';
  moveTip(e.originalEvent);
}
function moveTip(e) {
  let x = e.clientX + 16, y = e.clientY + 12;
  const w = tt.offsetWidth, h = tt.offsetHeight;
  if (x + w > window.innerWidth  - 10) x = e.clientX - w - 12;
  if (y + h > window.innerHeight - 10) y = e.clientY - h - 12;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}
function hideTip() { tt.style.display = 'none'; }

function addMarker(lat, lng, name, country, info, isIngame) {
  const icon = isIngame ? starIcon(24) : dotIcon(16);
  const m = L.marker([lat, lng], { icon }).addTo(map);
  m.on('mouseover', e => showTip(e, name, country, info));
  m.on('mousemove', e => moveTip(e.originalEvent));
  m.on('mouseout',  hideTip);

  // Also add a label for ingame markers
  if (isIngame) {
    const label = L.marker([lat, lng], {
      icon: L.divIcon({
        html: `<span style="font-family:'Special Elite',serif;font-size:12px;font-weight:bold;color:#1a1208;white-space:nowrap;text-shadow:1px 1px 0 #e8dfc8,-1px -1px 0 #e8dfc8,1px -1px 0 #e8dfc8,-1px 1px 0 #e8dfc8;margin-left:14px;margin-top:-6px;display:block">${name}</span>`,
        className: '',
        iconSize: [0, 0],
        iconAnchor: [0, 0]
      })
    }).addTo(map);
  }
}

// ════════════════════════════════════════════════
//  REPOSITORIES
// ════════════════════════════════════════════════

// ── IN-GAME (gold stars) ──
addMarker(50.87, 8.02, 'Siegen', 'Německo',
  'Měděný důl sloužící k úschově umění z cášské katedrály, Kolína nad Rýnem a dalších porýnských sbírek. Objeven americkými silami v dubnu 1945.',
  true);

addMarker(50.65, 10.18, 'Merkers', 'Německo',
  'Solný důl Kaiseroda. Uchovával veškeré zlaté rezervy Říšské banky a stovky uměleckých děl z berlínských muzeí. Objeven 3. americkou armádou v dubnu 1945.',
  true);

addMarker(47.56, 10.75, 'Neuschwanstein', 'Německo — Bavorsko',
  'Pohádkový hrad sloužící jako hlavní sklad ERR. Uchovával přes 21 000 předmětů uloupených z Francie, včetně celých soukromých židovských sbírek. Objeven v květnu 1945.',
  true);

addMarker(47.64, 13.77, 'Altaussee', 'Rakousko',
  'Solný důl v rakouských Alpách. Hitlerovo osobní úložiště pro plánované Führermuseum v Linci. Uchovával přes 6 500 děl včetně Gentského oltářního obrazu. Místní horníci zneškodnili nacistické demoliční nálože, aby umění zachránili.',
  true);

addMarker(48.86, 2.33, 'Jeu de Paume — Paříž', 'Francie',
  'Centrální třídící sklad ERR v okupované Paříži. Rose Vallandová tajně dokumentovala tisíce děl, která tudy prošla. V letech 1940–44 bylo zpracováno přes 20 000 předmětů.',
  false);

addMarker(52.52, 13.40, 'Berlín — protiletadlové věže a Zoo bunker', 'Německo',
  'Protiletadlové věže a Zoo bunker uchovávaly sbírky Kaiser Friedrich Museum během spojeneckého bombardování. Velká část byla evakuována na západ před sovětským postupem.',
  false);

addMarker(48.14, 11.58, 'Mnichov', 'Německo',
  'Hlavní nacistické kulturní centrum. Centrální sběrné místo pro umění určené do Führermusea. Procházely tudy Göringovy akvizice.',
  false);

addMarker(47.63, 13.00, 'Oblast Berchtesgaden', 'Německo — Bavorsko',
  'Hitlerovo horské útočiště. V okolí bylo uskladněno velké množství uloupeného umění včetně části Göringovy osobní sbírky. Objeveno americkými silami v květnu 1945.',
  false);

addMarker(51.20, 3.22, 'Bruggy — Chrám Panny Marie', 'Belgie',
  'Michelangelova Madonna bruggská byla nacisty uloupena v roce 1944. Jedno z mála děl vyvezených z Itálie za Michelangelova života. Nalezena v Altaussee v roce 1945.',
  false);

addMarker(52.37, 4.90, 'Amsterdam', 'Nizozemsko',
  'Okupované Nizozemsko bylo hlavním zdrojem uloupeného umění. ERR zabavila tisíce děl ze židovských sbírek. Rozsáhle zde působila Mühlmannova pracovní skupina.',
  false);

addMarker(48.21, 16.37, 'Vídeň', 'Rakousko',
  'Hlavní administrativní centrum pro loupeže umění. Kunsthistorisches Museum a soukromé židovské sbírky byly systematicky vykrádány po anšlusu v roce 1938.',
  false);

addMarker(50.06, 19.94, 'Krakov — hrad Wawel', 'Polsko',
  'Generální guvernér Hans Frank se usídlil na hradě Wawel a uchovával tam uloupené polské poklady včetně Leonardovy Dámy s hranostajem.',
  false);

addMarker(50.92, 13.88, 'Zámek Weesenstein', 'Německo — Sasko',
  'Saský zámek sloužící k úschově sbírek Drážďanské galerie evakuovaných před spojeneckým bombardováním. Obrazy byly později zabaveny sovětskými vojsky.',
  false);

addMarker(49.14, 9.22, 'Solný důl Heilbronn', 'Německo',
  'Rozsáhlý solný důl uchovávající sbírky Státní galerie ve Stuttgartu a dalších regionálních německých muzeí. Jeden z hlavních důlních skladů v jihozápadním Německu.',
  false);

addMarker(48.31, 14.29, 'Linec — plánované Führermuseum', 'Rakousko',
  'Hitlerovo plánované Führermuseum mělo být postaveno v jeho rodném Linci. Tisíce děl z celé Evropy byly speciálně určeny právě pro něj. Muzeum nikdy nebylo postaveno.',
  false);

addMarker(47.90, 10.30, 'Klášter Buxheim', 'Německo — Bavorsko',
  'Bavorský klášter sloužící k uskladnění více než 1 000 předmětů uloupeného ERR, včetně nábytku a dekorativního umění z francouzských zámků.',
  false);

addMarker(43.77, 11.26, 'Florencie', 'Itálie',
  'Nacisté systematicky rabovali florentská umělecká díla před ústupem v roce 1944. Sbírky Uffizi byly částečně evakuovány, přesto byla významná díla odcizena.',
  false);

addMarker(41.49, 13.82, 'Monte Cassino', 'Itálie',
  'Němečtí výsadkáři přesunuli umění z kláštera Monte Cassino do Vatikánu a poté do Německa v roce 1943 s odůvodněním, že ho chrání. Většina byla po válce navrácena.',
  false);

addMarker(47.82, 13.04, 'Zámek Fischhorn', 'Rakousko',
  'Zámek poblíž Zell am See sloužící k úschově Göringovy osobní sbírky v posledních měsících války. Spojenecká vojska zde v roce 1945 nalezla značné množství uloupeného umění.',
  false);

addMarker(51.79, 10.94, 'Quedlinburg', 'Německo',
  'Americký voják odcizil z místního dolu v roce 1945 tzv. Quedlinburské poklady — středověké církevní relikvie a rukopisy. Nalezeny nebyly až do 90. let 20. století.',
  false);

addMarker(48.47, 15.99, 'Zámek Immendorf', 'Rakousko',
  'Rakouský zámek uchovávající Klimtovy obrazy uloupené rodině Ledererových. SS zámek v květnu 1945 zapálila — několik Klimtových mistrovských děl při požáru zaniklo.',
  false);

// ── Apply sepia filter to tiles via CSS ──
const style = document.createElement('style');
style.textContent = `
  .map-tiles {
    filter: sepia(60%) brightness(0.88) contrast(1.05) saturate(0.7);
  }
  .leaflet-control-zoom a {
    background: #1a1510 !important;
    color: #9a7c2a !important;
    border-color: #6a5218 !important;
    font-family: 'Courier Prime', monospace !important;
  }
  .leaflet-control-zoom a:hover {
    background: #2a2010 !important;
    color: #e8c840 !important;
  }
  .leaflet-control-attribution {
    background: rgba(15,14,12,0.75) !important;
    color: #5a4a2a !important;
    font-family: 'Courier Prime', monospace !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: #6a5a2a !important; }
`;
document.head.appendChild(style);
</script>
</body>
</html>
